name: Update VA STOCK inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: va-stock-inventory
  cancel-in-progress: false

jobs:
  sync:
    if: vars.AUTO_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cloud_sync/requirements.txt
      - name: Install browser dependencies
        run: |
          python -m pip install -r cloud_sync/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check cloud sync logic
        run: python -m unittest discover -s cloud_sync -p test_cloud_sync.py -v
      - name: Fetch and publish inventory
        env:
          VAONLINE_URL: ${{ secrets.VAONLINE_URL }}
          VAONLINE_STORAGE_STATE_GZIP_B64: ${{ secrets.VAONLINE_STORAGE_STATE_GZIP_B64 }}
          VAONLINE_REPORT_OPTIONS: ${{ secrets.VAONLINE_REPORT_OPTIONS }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python cloud_sync/run_sync.py
