services:
  - type: web
    name: va-stock
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: VA_STOCK_USERNAME
        value: vastock
      - key: VA_STOCK_PASSWORD
        sync: false
      - key: INVENTORY_PATH
        value: /etc/secrets/inventory.json
